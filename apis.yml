name: Bible Chat
description: 'Bible Chat is a faith-focused consumer mobile application built by Soulstream, a Romanian
  startup founded in 2023 by Laurentiu Balasa and Marius Iordache, that pairs AI-guided conversation with
  Scripture to help people study the Bible and grow spiritually. Features include topical Bible verses,
  guided Bible lessons, a faith Q&A assistant, verse of the day, a Bible glossary, and podcast and blog
  content, delivered through iOS and Android apps. It is marketed as "the #1 Faith App in the World."
  This profile was surfaced as a portfolio company of True Ventures and is maintained in the API Evangelist
  network; the company publishes a consumer product and does not currently expose a public developer API.'
